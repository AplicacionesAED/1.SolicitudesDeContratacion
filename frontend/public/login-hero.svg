<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Obra en construcción con grúa y canecas de separación de residuos">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2d4d"/>
      <stop offset="0.6" stop-color="#14308f"/>
      <stop offset="1" stop-color="#1f6f8b"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3b44"/>
      <stop offset="1" stop-color="#06222a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#cielo)"/>

  <!-- sol suave y reciclaje al fondo -->
  <circle cx="1230" cy="250" r="190" fill="#ffffff" opacity="0.06"/>
  <g transform="translate(1230 250)" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <path d="M-60 -70 A100 100 0 0 1 80 -50"/><path d="M62 -78 L82 -48 L48 -40"/>
    <path d="M90 40 A100 100 0 0 1 -30 100"/><path d="M-12 118 L-32 98 L-6 78"/>
    <path d="M-92 20 A100 100 0 0 1 -72 -62"/><path d="M-98 -50 L-72 -66 L-52 -42"/>
  </g>

  <!-- edificios en altura y obra -->
  <g fill="#ffffff" opacity="0.10">
    <rect x="90" y="470" width="170" height="380"/><rect x="280" y="380" width="130" height="470"/>
    <rect x="430" y="520" width="190" height="330"/><rect x="1020" y="440" width="150" height="410"/>
    <rect x="1190" y="540" width="210" height="310"/><rect x="1420" y="460" width="130" height="390"/>
  </g>
  <g fill="#ffffff" opacity="0.18">
    <rect x="110" y="500" width="14" height="22"/><rect x="140" y="500" width="14" height="22"/><rect x="170" y="500" width="14" height="22"/>
    <rect x="110" y="550" width="14" height="22"/><rect x="170" y="550" width="14" height="22"/><rect x="110" y="600" width="14" height="22"/>
    <rect x="300" y="420" width="14" height="22"/><rect x="330" y="420" width="14" height="22"/><rect x="360" y="420" width="14" height="22"/>
    <rect x="300" y="470" width="14" height="22"/><rect x="360" y="470" width="14" height="22"/><rect x="330" y="520" width="14" height="22"/>
    <rect x="1040" y="480" width="14" height="22"/><rect x="1070" y="480" width="14" height="22"/><rect x="1100" y="480" width="14" height="22"/>
    <rect x="1040" y="530" width="14" height="22"/><rect x="1100" y="530" width="14" height="22"/>
  </g>

  <!-- grúa torre -->
  <g stroke="#ffffff" stroke-width="6" fill="none" opacity="0.55" stroke-linejoin="round">
    <path d="M760 850 V300"/><path d="M800 850 V300"/>
    <path d="M760 340 L800 380 L760 420 L800 460 L760 500 L800 540 L760 580 L800 620 L760 660 L800 700 L760 740 L800 780 L760 820"/>
    <path d="M560 300 H1140"/><path d="M560 300 L780 220 L1000 300"/>
    <path d="M780 220 V300"/>
    <path d="M610 300 V380"/><path d="M1060 300 V330"/>
    <path d="M610 380 H640 V415 H610 Z" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="1020" y="330" width="80" height="26" fill="#f4b400" fill-opacity="0.55" stroke="none"/>
  </g>

  <!-- suelo -->
  <rect y="850" width="1600" height="150" fill="url(#suelo)"/>
  <rect y="846" width="1600" height="8" fill="#ffffff" opacity="0.18"/>

  <!-- canecas de separación de residuos -->
  <g>
    <g transform="translate(980 700)">
      <path d="M0 0 H130 L118 150 H12 Z" fill="#2fa84f"/><rect x="-6" y="-14" width="142" height="20" rx="6" fill="#23873e"/>
      <path d="M65 40 l-18 28 h14 v22 h8 v-22 h14 z" fill="#ffffff" opacity="0.75"/>
    </g>
    <g transform="translate(1130 700)">
      <path d="M0 0 H130 L118 150 H12 Z" fill="#2b7bd6"/><rect x="-6" y="-14" width="142" height="20" rx="6" fill="#1f5fab"/>
      <rect x="40" y="46" width="50" height="44" rx="6" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.75"/>
    </g>
    <g transform="translate(1280 700)">
      <path d="M0 0 H130 L118 150 H12 Z" fill="#8e969f"/><rect x="-6" y="-14" width="142" height="20" rx="6" fill="#6d747c"/>
      <circle cx="65" cy="68" r="24" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.75"/>
    </g>
    <g transform="translate(1430 700)">
      <path d="M0 0 H130 L118 150 H12 Z" fill="#e9852b"/><rect x="-6" y="-14" width="142" height="20" rx="6" fill="#c46b1b"/>
      <path d="M40 90 L65 44 L90 90 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.75"/>
    </g>
  </g>

  <!-- escombros ordenados / pallets -->
  <g fill="#ffffff" opacity="0.2">
    <rect x="120" y="820" width="150" height="14"/><rect x="120" y="840" width="150" height="14"/>
    <rect x="150" y="790" width="100" height="30"/>
  </g>
</svg>
